prefix: default
device: cuda
mode: train
log_dir: logs/${mode}
eval_data_path: null
use_wandb: true
seed: 0
name: etseed

agent:
  agent_name: ${name}

hydra:
  run:
    dir: ${log_dir}/${prefix}

pred_horizon: 8
obs_horizon: 2
action_horizon: 4
T_a: ${pred_horizon}  # what is this???
k_neighbours: 8
batch_size: 900
num_epochs: 1000
learning_rate: 0.0005
weight_decay: 1e-6
betas: [0.95, 0.999]
eps: 1.0e-08
sigma_r: 0.005
sigma_t: 0.003
equiv_frac: 0.1
save_freq: 3
max_ckpts: 2
diffusion_steps: 100
diffusion_mode: squaredcos_cap_v2
loadFromCkpt: True
lr_cycle_scale_factor: 1.0

dev:
  use_ddpm: False
  k_option: 3 # 0 diffusion steps as type 0 scalar; # 1 diffusion steps as type 0 rotation; 2 diffusion steps as type 1 rotation; 3 no k in se3
  diffusion_option: 0 # 0: the default, predict the gt H0;  1: predict relative transformation from Ht to H0; 2: no diffusion, no denoising; 3: no diffusion during inference,early_return will be set to True
  early_return: True # for se3 diffusion option 0 and 2: set this to True ~~might~~ make sense, actually for all predict sample objective or no diffusion at all
  sh_basis_compute_gradients: True
  rot_aggregation: mean # mean/separate_mean/min/abs_min/max
  trans_aggregation: mean # mean/separate_mean/min/abs_min/max
  trans_norm: False
  ddpm_predict_noise: True
  no_noise: False # only for se3 diffusion
  low_memory: True
  se3: 0 # 0=SE3ManiNet_Fused 1=SE3ManiNet_ori_pos_sep
  unet: True
  unet_film: False
  unet_equivariance: False
  Ho_in_B: False
  diff: True
  arch: 0 # 0: one se3 for pc enc + action prediction; 2: two sep. se3, potentially w/ unet
  bugfix: 0000000000000001 # last bit: knn in se3 vision
  testing: 0 #1: prepare_model_input3 instead of prepare_model_input2
  sanity_check: 0 # 1: se3 pc enc + unet;
  pc_xyz_feat: True # use xyz position of pc explicitly as features
  eef_xyz_feat: False # use xyz position of end effector explicitly as features # only works w/ testing
  latent_pc_as_feat: False
  pc_inv: False
  noisy_action_as_k: False
  test_lr_scheduler: False
  num_degrees: 4 # 5
  num_channels: 16 # 32
  num_heads: 8
  channels_div: 2
  global_cond: 0 # 0: proposed actions as global; 1: latent pc as global 2: None
  local_cond: 0 # 0: None; 1: proposed actions as local
  sign_mismatch: True
  k_target: noise # noise; noisy_actions; actions; (action=lie_h_t)
  k_on_lie: True
  k1_type_1: False
  k2_type_1: False
  proper_se3_test: False
  rel_gripper_pos: False
  nonlinear: False
  
training:
  ckpt: null

env:
  env_class: ???
  num_eef: 1
  dof: 7
  eef_dim: 13

model:
  obs_horizon: ${obs_horizon}
  ac_horizon: ${action_horizon}
  pred_horizon: ${pred_horizon}

data:
  dataset_class: base_dataset
  dataset:
    num_training_steps: ???
    path: null
    num_points: 40 # should match with _ropeLength 0.4:17 0.8: 35 1.0:44? 40:pusht
    num_augment: 0
    same_aug_per_sample: true
    aug_keep_original: true
    aug_scale_low: 0.5
    aug_scale_high: 1.5
    aug_scale_aspect_limit: 1.0
    aug_scale_rot: -1
    aug_scale_pos: 0.1
    aug_zero_z_offset: false
    aug_center: [0., 0., 0.]
    shuffle_pc: false # https://github.com/charlesq34/pointnet2/issues/143#issuecomment-523416620 # was true
    num_workers: 4
    dof: ${env.dof}
    num_eef: ${env.num_eef}
    eef_dim: ${env.eef_dim}
    obs_horizon: ${model.obs_horizon}
    pred_horizon: ${model.pred_horizon}
    reduce_horizon_dim: false
    min_demo_length: 15
    keys_to_keep: ["pc","eef_pos", "action"]


  valid_dataset:
    num_training_steps: ???
    path: null
    num_points:  ${data.dataset.num_points}
    num_augment:  ${data.dataset.num_augment}
    same_aug_per_sample:  ${data.dataset.same_aug_per_sample}
    aug_keep_original:  ${data.dataset.aug_keep_original}
    aug_scale_low:  ${data.dataset.aug_scale_low}
    aug_scale_high:  ${data.dataset.aug_scale_high}
    aug_scale_aspect_limit:  ${data.dataset.aug_scale_aspect_limit}
    aug_scale_rot:  ${data.dataset.aug_scale_rot}
    aug_scale_pos:  ${data.dataset.aug_scale_pos}
    aug_zero_z_offset:  ${data.dataset.aug_zero_z_offset}
    aug_center:  ${data.dataset.aug_center}
    shuffle_pc:  ${data.dataset.shuffle_pc} # https://github.com/charlesq34/pointnet2/issues/143#issuecomment-523416620 # was true
    num_workers:  ${data.dataset.num_workers}
    dof:  ${data.dataset.dof}
    num_eef:  ${data.dataset.num_eef}
    eef_dim:  ${data.dataset.eef_dim}
    obs_horizon:  ${data.dataset.obs_horizon}
    pred_horizon:  ${data.dataset.pred_horizon}
    reduce_horizon_dim:  ${data.dataset.reduce_horizon_dim}
    min_demo_length:  ${data.dataset.min_demo_length}
    keys_to_keep: ["pc","eef_pos", "action"]

wandb:
  entity: ab36
  project: equibot

franka_rope:
  physics_dt: 1.0/10.0
  rendering_dt: 1.0/10.0
  _randomize: False
  _randomize_on_reset: False
  pusht_pos: [0.1,0.1,0] # [0,0,0] or [0.1,0.1,0]
  pusht_ori: [0,0,-30] # [0,0,0] or [0,0,-30]
  test_pc_permutation: False
  translation: null # [-0.5,-0.5,0] or null
  rotation: null # [0,0,30] or null
  scale: null # [1.1,1.15,1.2]  or null # [Warning] [omni.physicsschema.plugin] Non-uniform scale may result in a non matching collision representation
  _rope_y_pos: null # null or 0.7
  extra_scenes: null #null #[fixed_cylinder] # list, possible values: fixed_cylinder, visual_line
  _ropeLength: 0.8
  _rope_damping: 0.6
  _rope_stiffness: 0.1
  from_demo: null
  start_time: 150
  manually_close: False
  max_end: 111 #360 # 600
  seed: 42
  rel: True
  rpy: False
  flow: False
  cap: null # delta pos per seconds, depends on fps, # 0.1
  cup: null # min speed
  update_ori: True
  preprocess:
    input_dir: r"C:\Users\Shadow\project\franka_rope\demos\02_train"
    output_dir: r"C:\Users\Shadow\project\franka_data\tmp"
    rel: ${franka_rope.rel}
    rpy: ${franka_rope.rpy}
    flow: ${franka_rope.flow}
    